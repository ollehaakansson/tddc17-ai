<svg xmlns="http://www.w3.org/2000/svg" width="980" height="390" viewBox="0 0 980 390" role="img" aria-labelledby="title desc">
  <title id="title">Single artificial neuron</title>
  <desc id="desc">Four inputs connect through weights into a weighted sum with bias, then through a ReLU activation to one output.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#fff"/>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #111827; }
    .label { font-size: 20px; font-weight: 600; }
    .small { font-size: 17px; fill: #374151; }
    .line { stroke: #6b7280; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .input { fill: #dbeafe; stroke: #60a5fa; stroke-width: 2; }
    .hidden { fill: #fef3c7; stroke: #f59e0b; stroke-width: 2; }
    .output { fill: #d1fae5; stroke: #34d399; stroke-width: 2; }
    .card { filter: drop-shadow(0 2px 3px rgba(15, 23, 42, 0.14)); }
  </style>

  <g class="card">
    <circle class="input" cx="115" cy="65" r="33"/>
    <circle class="input" cx="115" cy="145" r="33"/>
    <circle class="input" cx="115" cy="225" r="33"/>
    <circle class="input" cx="115" cy="305" r="33"/>
  </g>
  <text class="label" x="115" y="72" text-anchor="middle">x<tspan baseline-shift="sub" font-size="13">1</tspan></text>
  <text class="label" x="115" y="152" text-anchor="middle">x<tspan baseline-shift="sub" font-size="13">2</tspan></text>
  <text class="label" x="115" y="232" text-anchor="middle">x<tspan baseline-shift="sub" font-size="13">3</tspan></text>
  <text class="label" x="115" y="312" text-anchor="middle">x<tspan baseline-shift="sub" font-size="13">d</tspan></text>

  <g class="card">
    <circle class="hidden" cx="485" cy="185" r="80"/>
  </g>
  <text class="label" x="485" y="178" text-anchor="middle">weighted</text>
  <text class="label" x="485" y="206" text-anchor="middle">sum + b</text>

  <line class="line" x1="148" y1="65" x2="408" y2="168"/>
  <line class="line" x1="148" y1="145" x2="403" y2="182"/>
  <line class="line" x1="148" y1="225" x2="403" y2="194"/>
  <line class="line" x1="148" y1="305" x2="408" y2="208"/>
  <text class="small" x="260" y="100">w<tspan baseline-shift="sub" font-size="11">1</tspan></text>
  <text class="small" x="260" y="152">w<tspan baseline-shift="sub" font-size="11">2</tspan></text>
  <text class="small" x="260" y="232">w<tspan baseline-shift="sub" font-size="11">3</tspan></text>
  <text class="small" x="260" y="292">w<tspan baseline-shift="sub" font-size="11">d</tspan></text>

  <line class="line" x1="567" y1="185" x2="682" y2="185"/>
  <text class="small" x="624" y="170" text-anchor="middle">z</text>

  <g class="card">
    <rect class="output" x="690" y="135" width="145" height="100" rx="10"/>
  </g>
  <text class="label" x="762.5" y="193" text-anchor="middle">ReLU</text>

  <line class="line" x1="835" y1="185" x2="908" y2="185"/>
  <text class="label" x="936" y="192" text-anchor="middle">y</text>
</svg>
