<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="780" viewBox="0 0 1080 780" role="img" aria-labelledby="title desc">
  <title id="title">Padding preserves image dimensions</title>
  <desc id="desc">Top row: a 3x3 filter on a 6x6 input with no padding produces a 4x4 output. Bottom row: with one pixel of zero padding around the input, the same filter produces a 6x6 output, matching the input size.</desc>
  <rect width="100%" height="100%" fill="#fff"/>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #111827; }
    .cell { fill: #f9fafb; stroke: #9ca3af; stroke-width: 1; }
    .pad { fill: #1f2937; stroke: #111827; stroke-width: 1; }
    .active { fill: #fef3c7; stroke: #d97706; stroke-width: 1.2; }
    .out { fill: #d1fae5; stroke: #6b7280; stroke-width: 1.2; }
    .outActive { fill: #4ade80; stroke: #166534; stroke-width: 2; }
    .filter { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
    .window { fill: none; stroke: #f59e0b; stroke-width: 4; }
    .title { font-size: 22px; font-weight: 700; }
    .sub { font-size: 19px; font-weight: 600; }
    .small { font-size: 15px; fill: #374151; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 16px; fill: #1f2937; }
    .arrow { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .divider { stroke: #e5e7eb; stroke-width: 2; }
    .card { filter: drop-shadow(0 2px 3px rgba(15, 23, 42, 0.12)); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#374151"/>
    </marker>
  </defs>

  <text class="title" x="540" y="34" text-anchor="middle">Padding keeps the output the same size as the input</text>

  <!-- ============ TOP ROW: no padding ============ -->
  <text class="sub" x="180" y="78" text-anchor="middle">Without padding</text>
  <text class="small" x="180" y="103" text-anchor="middle">6 × 6 input</text>

  <!-- input 6x6 at (70,130), cell=36 -->
  <g transform="translate(70,130)">
    <rect class="cell" x="0" y="0" width="36" height="36"/><rect class="cell" x="36" y="0" width="36" height="36"/><rect class="cell" x="72" y="0" width="36" height="36"/><rect class="cell" x="108" y="0" width="36" height="36"/><rect class="cell" x="144" y="0" width="36" height="36"/><rect class="cell" x="180" y="0" width="36" height="36"/>
    <rect class="cell" x="0" y="36" width="36" height="36"/><rect class="cell" x="36" y="36" width="36" height="36"/><rect class="cell" x="72" y="36" width="36" height="36"/><rect class="cell" x="108" y="36" width="36" height="36"/><rect class="cell" x="144" y="36" width="36" height="36"/><rect class="cell" x="180" y="36" width="36" height="36"/>
    <rect class="cell" x="0" y="72" width="36" height="36"/><rect class="cell" x="36" y="72" width="36" height="36"/><rect class="cell" x="72" y="72" width="36" height="36"/><rect class="cell" x="108" y="72" width="36" height="36"/><rect class="cell" x="144" y="72" width="36" height="36"/><rect class="cell" x="180" y="72" width="36" height="36"/>
    <rect class="cell" x="0" y="108" width="36" height="36"/><rect class="cell" x="36" y="108" width="36" height="36"/><rect class="cell" x="72" y="108" width="36" height="36"/><rect class="cell" x="108" y="108" width="36" height="36"/><rect class="cell" x="144" y="108" width="36" height="36"/><rect class="cell" x="180" y="108" width="36" height="36"/>
    <rect class="cell" x="0" y="144" width="36" height="36"/><rect class="cell" x="36" y="144" width="36" height="36"/><rect class="cell" x="72" y="144" width="36" height="36"/><rect class="cell" x="108" y="144" width="36" height="36"/><rect class="cell" x="144" y="144" width="36" height="36"/><rect class="cell" x="180" y="144" width="36" height="36"/>
    <rect class="cell" x="0" y="180" width="36" height="36"/><rect class="cell" x="36" y="180" width="36" height="36"/><rect class="cell" x="72" y="180" width="36" height="36"/><rect class="cell" x="108" y="180" width="36" height="36"/><rect class="cell" x="144" y="180" width="36" height="36"/><rect class="cell" x="180" y="180" width="36" height="36"/>
    <rect class="window" x="0" y="0" width="108" height="108"/>
  </g>

  <!-- filter glyph -->
  <rect class="filter" x="330" y="215" width="90" height="90" rx="4"/>
  <text class="small" x="375" y="252" text-anchor="middle">3 × 3</text>
  <text class="small" x="375" y="275" text-anchor="middle">filter</text>

  <!-- output 4x4 at (575,170), cell=36 -->
  <text class="small" x="647" y="155" text-anchor="middle">4 × 4 output</text>
  <g transform="translate(575,170)">
    <rect class="outActive" x="0" y="0" width="36" height="36"/><rect class="out" x="36" y="0" width="36" height="36"/><rect class="out" x="72" y="0" width="36" height="36"/><rect class="out" x="108" y="0" width="36" height="36"/>
    <rect class="out" x="0" y="36" width="36" height="36"/><rect class="out" x="36" y="36" width="36" height="36"/><rect class="out" x="72" y="36" width="36" height="36"/><rect class="out" x="108" y="36" width="36" height="36"/>
    <rect class="out" x="0" y="72" width="36" height="36"/><rect class="out" x="36" y="72" width="36" height="36"/><rect class="out" x="72" y="72" width="36" height="36"/><rect class="out" x="108" y="72" width="36" height="36"/>
    <rect class="out" x="0" y="108" width="36" height="36"/><rect class="out" x="36" y="108" width="36" height="36"/><rect class="out" x="72" y="108" width="36" height="36"/><rect class="out" x="108" y="108" width="36" height="36"/>
  </g>

  <text class="small" x="855" y="195" text-anchor="start">output shrinks</text>
  <text class="mono" x="855" y="222" text-anchor="start">6 − 3 + 1 = 4</text>
  <text class="small" x="855" y="262" text-anchor="start">the filter can not</text>
  <text class="small" x="855" y="282" text-anchor="start">sit on edge pixels</text>

  <line class="arrow" x1="290" y1="248" x2="326" y2="255"/>
  <line class="arrow" x1="424" y1="265" x2="572" y2="190"/>

  <!-- divider -->
  <line class="divider" x1="40" y1="395" x2="1040" y2="395"/>

  <!-- ============ BOTTOM ROW: with padding ============ -->
  <text class="sub" x="180" y="435" text-anchor="middle">With zero padding = 1</text>
  <text class="small" x="180" y="460" text-anchor="middle">6 × 6 input + 1-pixel black border</text>

  <!-- padded 8x8 at (60,480), cell=30 -->
  <g transform="translate(60,480)">
    <rect class="pad" x="0" y="0" width="30" height="30"/><rect class="pad" x="30" y="0" width="30" height="30"/><rect class="pad" x="60" y="0" width="30" height="30"/><rect class="pad" x="90" y="0" width="30" height="30"/><rect class="pad" x="120" y="0" width="30" height="30"/><rect class="pad" x="150" y="0" width="30" height="30"/><rect class="pad" x="180" y="0" width="30" height="30"/><rect class="pad" x="210" y="0" width="30" height="30"/>
    <rect class="pad" x="0" y="30" width="30" height="30"/><rect class="cell" x="30" y="30" width="30" height="30"/><rect class="cell" x="60" y="30" width="30" height="30"/><rect class="cell" x="90" y="30" width="30" height="30"/><rect class="cell" x="120" y="30" width="30" height="30"/><rect class="cell" x="150" y="30" width="30" height="30"/><rect class="cell" x="180" y="30" width="30" height="30"/><rect class="pad" x="210" y="30" width="30" height="30"/>
    <rect class="pad" x="0" y="60" width="30" height="30"/><rect class="cell" x="30" y="60" width="30" height="30"/><rect class="cell" x="60" y="60" width="30" height="30"/><rect class="cell" x="90" y="60" width="30" height="30"/><rect class="cell" x="120" y="60" width="30" height="30"/><rect class="cell" x="150" y="60" width="30" height="30"/><rect class="cell" x="180" y="60" width="30" height="30"/><rect class="pad" x="210" y="60" width="30" height="30"/>
    <rect class="pad" x="0" y="90" width="30" height="30"/><rect class="cell" x="30" y="90" width="30" height="30"/><rect class="cell" x="60" y="90" width="30" height="30"/><rect class="cell" x="90" y="90" width="30" height="30"/><rect class="cell" x="120" y="90" width="30" height="30"/><rect class="cell" x="150" y="90" width="30" height="30"/><rect class="cell" x="180" y="90" width="30" height="30"/><rect class="pad" x="210" y="90" width="30" height="30"/>
    <rect class="pad" x="0" y="120" width="30" height="30"/><rect class="cell" x="30" y="120" width="30" height="30"/><rect class="cell" x="60" y="120" width="30" height="30"/><rect class="cell" x="90" y="120" width="30" height="30"/><rect class="cell" x="120" y="120" width="30" height="30"/><rect class="cell" x="150" y="120" width="30" height="30"/><rect class="cell" x="180" y="120" width="30" height="30"/><rect class="pad" x="210" y="120" width="30" height="30"/>
    <rect class="pad" x="0" y="150" width="30" height="30"/><rect class="cell" x="30" y="150" width="30" height="30"/><rect class="cell" x="60" y="150" width="30" height="30"/><rect class="cell" x="90" y="150" width="30" height="30"/><rect class="cell" x="120" y="150" width="30" height="30"/><rect class="cell" x="150" y="150" width="30" height="30"/><rect class="cell" x="180" y="150" width="30" height="30"/><rect class="pad" x="210" y="150" width="30" height="30"/>
    <rect class="pad" x="0" y="180" width="30" height="30"/><rect class="cell" x="30" y="180" width="30" height="30"/><rect class="cell" x="60" y="180" width="30" height="30"/><rect class="cell" x="90" y="180" width="30" height="30"/><rect class="cell" x="120" y="180" width="30" height="30"/><rect class="cell" x="150" y="180" width="30" height="30"/><rect class="cell" x="180" y="180" width="30" height="30"/><rect class="pad" x="210" y="180" width="30" height="30"/>
    <rect class="pad" x="0" y="210" width="30" height="30"/><rect class="pad" x="30" y="210" width="30" height="30"/><rect class="pad" x="60" y="210" width="30" height="30"/><rect class="pad" x="90" y="210" width="30" height="30"/><rect class="pad" x="120" y="210" width="30" height="30"/><rect class="pad" x="150" y="210" width="30" height="30"/><rect class="pad" x="180" y="210" width="30" height="30"/><rect class="pad" x="210" y="210" width="30" height="30"/>
    <rect class="window" x="0" y="0" width="90" height="90"/>
  </g>

  <!-- filter glyph -->
  <rect class="filter" x="340" y="565" width="90" height="90" rx="4"/>
  <text class="small" x="385" y="602" text-anchor="middle">3 × 3</text>
  <text class="small" x="385" y="625" text-anchor="middle">filter</text>

  <!-- output 6x6 at (570,525), cell=30 -->
  <text class="small" x="660" y="510" text-anchor="middle">6 × 6 output</text>
  <g transform="translate(570,525)">
    <rect class="outActive" x="0" y="0" width="30" height="30"/><rect class="out" x="30" y="0" width="30" height="30"/><rect class="out" x="60" y="0" width="30" height="30"/><rect class="out" x="90" y="0" width="30" height="30"/><rect class="out" x="120" y="0" width="30" height="30"/><rect class="out" x="150" y="0" width="30" height="30"/>
    <rect class="out" x="0" y="30" width="30" height="30"/><rect class="out" x="30" y="30" width="30" height="30"/><rect class="out" x="60" y="30" width="30" height="30"/><rect class="out" x="90" y="30" width="30" height="30"/><rect class="out" x="120" y="30" width="30" height="30"/><rect class="out" x="150" y="30" width="30" height="30"/>
    <rect class="out" x="0" y="60" width="30" height="30"/><rect class="out" x="30" y="60" width="30" height="30"/><rect class="out" x="60" y="60" width="30" height="30"/><rect class="out" x="90" y="60" width="30" height="30"/><rect class="out" x="120" y="60" width="30" height="30"/><rect class="out" x="150" y="60" width="30" height="30"/>
    <rect class="out" x="0" y="90" width="30" height="30"/><rect class="out" x="30" y="90" width="30" height="30"/><rect class="out" x="60" y="90" width="30" height="30"/><rect class="out" x="90" y="90" width="30" height="30"/><rect class="out" x="120" y="90" width="30" height="30"/><rect class="out" x="150" y="90" width="30" height="30"/>
    <rect class="out" x="0" y="120" width="30" height="30"/><rect class="out" x="30" y="120" width="30" height="30"/><rect class="out" x="60" y="120" width="30" height="30"/><rect class="out" x="90" y="120" width="30" height="30"/><rect class="out" x="120" y="120" width="30" height="30"/><rect class="out" x="150" y="120" width="30" height="30"/>
    <rect class="out" x="0" y="150" width="30" height="30"/><rect class="out" x="30" y="150" width="30" height="30"/><rect class="out" x="60" y="150" width="30" height="30"/><rect class="out" x="90" y="150" width="30" height="30"/><rect class="out" x="120" y="150" width="30" height="30"/><rect class="out" x="150" y="150" width="30" height="30"/>
  </g>

  <text class="small" x="855" y="555" text-anchor="start">size preserved</text>
  <text class="mono" x="855" y="582" text-anchor="start">6 + 2·1 − 3 + 1 = 6</text>
  <text class="small" x="855" y="622" text-anchor="start">the filter can sit on</text>
  <text class="small" x="855" y="642" text-anchor="start">every image pixel</text>

  <line class="arrow" x1="304" y1="600" x2="336" y2="605"/>
  <line class="arrow" x1="434" y1="605" x2="572" y2="545"/>
</svg>
