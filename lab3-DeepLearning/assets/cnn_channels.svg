<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">CNN channels</title>
  <desc id="desc">A convolution maps input channels to output channels; the number of channels can change after each convolution.</desc>
  <rect width="100%" height="100%" fill="#fff"/>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #111827; }
    .plane1 { fill: #dbeafe; stroke: #60a5fa; stroke-width: 1.8; }
    .plane2 { fill: #fef3c7; stroke: #f59e0b; stroke-width: 1.8; }
    .plane3 { fill: #d1fae5; stroke: #34d399; stroke-width: 1.8; }
    .label { font-size: 20px; font-weight: 600; }
    .small { font-size: 16px; fill: #374151; }
    .note { font-size: 16px; fill: #4b5563; font-style: italic; }
    .arrow { stroke: #374151; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
    .card { filter: drop-shadow(0 2px 3px rgba(15, 23, 42, 0.14)); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#374151"/>
    </marker>
  </defs>

  <text class="label" x="155" y="45" text-anchor="middle">input tensor</text>
  <g class="card">
    <rect class="plane1" x="70" y="120" width="170" height="170" rx="6"/>
  </g>
  <text class="label" x="155" y="210" text-anchor="middle">1 channel</text>
  <text class="small" x="155" y="235" text-anchor="middle">Fashion-MNIST</text>
  <text class="small" x="155" y="318" text-anchor="middle">(1, 28, 28)</text>

  <g class="card">
    <rect class="plane2" x="380" y="115" width="150" height="150" rx="6"/>
    <rect class="plane2" x="395" y="130" width="150" height="150" rx="6"/>
    <rect class="plane2" x="410" y="145" width="150" height="150" rx="6"/>
  </g>
  <text class="label" x="485" y="222" text-anchor="middle">8 channels</text>
  <text class="small" x="485" y="323" text-anchor="middle">after Conv2d(1, 8, …)</text>

  <g class="card">
    <rect class="plane3" x="690" y="95" width="125" height="125" rx="6"/>
    <rect class="plane3" x="703" y="108" width="125" height="125" rx="6"/>
    <rect class="plane3" x="716" y="121" width="125" height="125" rx="6"/>
    <rect class="plane3" x="729" y="134" width="125" height="125" rx="6"/>
  </g>
  <text class="label" x="778" y="203" text-anchor="middle">16 channels</text>
  <text class="small" x="778" y="323" text-anchor="middle">after Conv2d(8, 16, …)</text>

  <line class="arrow" x1="250" y1="205" x2="370" y2="205"/>
  <line class="arrow" x1="570" y1="205" x2="680" y2="205"/>
  <text class="note" x="450" y="382" text-anchor="middle">height and width may change, and the number of channels often increases</text>
</svg>
