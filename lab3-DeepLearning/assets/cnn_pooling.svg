<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360" role="img" aria-labelledby="title desc">
  <title id="title">Max pooling shrinks feature maps</title>
  <desc id="desc">Max pooling summarizes small patches by their maximum value, reducing width and height.</desc>
  <rect width="100%" height="100%" fill="#fff"/>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #111827; }
    .cell { fill: #f9fafb; stroke: #9ca3af; stroke-width: 1.2; }
    .active { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
    .out { fill: #d1fae5; stroke: #16a34a; stroke-width: 2; }
    .label { font-size: 20px; font-weight: 600; }
    .small { font-size: 16px; fill: #374151; font-style: italic; }
    .arrow { stroke: #374151; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#374151"/>
    </marker>
  </defs>
  <text class="label" x="170" y="35" text-anchor="middle">feature map</text>
  <g transform="translate(80,70)">
    <rect class="active" x="0" y="0" width="55" height="55"/><rect class="active" x="55" y="0" width="55" height="55"/><rect class="cell" x="110" y="0" width="55" height="55"/><rect class="cell" x="165" y="0" width="55" height="55"/>
    <rect class="active" x="0" y="55" width="55" height="55"/><rect class="active" x="55" y="55" width="55" height="55"/><rect class="cell" x="110" y="55" width="55" height="55"/><rect class="cell" x="165" y="55" width="55" height="55"/>
    <rect class="cell" x="0" y="110" width="55" height="55"/><rect class="cell" x="55" y="110" width="55" height="55"/><rect class="cell" x="110" y="110" width="55" height="55"/><rect class="cell" x="165" y="110" width="55" height="55"/>
    <rect class="cell" x="0" y="165" width="55" height="55"/><rect class="cell" x="55" y="165" width="55" height="55"/><rect class="cell" x="110" y="165" width="55" height="55"/><rect class="cell" x="165" y="165" width="55" height="55"/>
  </g>
  <text class="small" x="190" y="320" text-anchor="middle">2 × 2 max pool looks at a small patch</text>
  <line class="arrow" x1="340" y1="180" x2="480" y2="180"/>
  <g transform="translate(520,125)" filter="drop-shadow(0 2px 3px rgba(15,23,42,0.14))">
    <rect class="out" x="0" y="0" width="65" height="65"/><rect class="out" x="65" y="0" width="65" height="65"/>
    <rect class="out" x="0" y="65" width="65" height="65"/><rect class="out" x="65" y="65" width="65" height="65"/>
  </g>
  <text class="label" x="585" y="85" text-anchor="middle">smaller map</text>
  <text class="small" x="585" y="320" text-anchor="middle">width and height shrink over time</text>
</svg>
