<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">ReLU activation function</title>
  <desc id="desc">The ReLU function is zero for negative inputs and equal to the input for positive inputs.</desc>
  <rect width="100%" height="100%" fill="#fff"/>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #111827; }
    .axis { stroke: #1f2937; stroke-width: 2; }
    .grid { stroke: #e5e7eb; stroke-width: 1; }
    .curve { stroke: #2563eb; stroke-width: 5; fill: none; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 1px 2px rgba(37, 99, 235, 0.25)); }
    .label { font-size: 20px; font-weight: 600; }
    .small { font-size: 16px; fill: #374151; }
    .tick { font-size: 14px; fill: #6b7280; }
    .note { font-size: 16px; fill: #4b5563; font-style: italic; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#1f2937"/>
    </marker>
  </defs>

  <line class="grid" x1="90" y1="330" x2="680" y2="330"/>
  <line class="grid" x1="90" y1="260" x2="680" y2="260"/>
  <line class="grid" x1="90" y1="190" x2="680" y2="190"/>
  <line class="grid" x1="90" y1="120" x2="680" y2="120"/>
  <line class="grid" x1="190" y1="70" x2="190" y2="355"/>
  <line class="grid" x1="290" y1="70" x2="290" y2="355"/>
  <line class="grid" x1="390" y1="70" x2="390" y2="355"/>
  <line class="grid" x1="490" y1="70" x2="490" y2="355"/>
  <line class="grid" x1="590" y1="70" x2="590" y2="355"/>

  <line class="axis" x1="90" y1="330" x2="690" y2="330" marker-end="url(#arrow)"/>
  <line class="axis" x1="390" y1="360" x2="390" y2="65" marker-end="url(#arrow)"/>

  <polyline class="curve" points="110,330 390,330 650,70"/>
  <circle cx="390" cy="330" r="5.5" fill="#2563eb"/>

  <text class="label" x="700" y="337">x</text>
  <text class="label" x="356" y="58">ReLU(x)</text>
  <text class="tick" x="382" y="352">0</text>
  <text class="tick" x="190" y="352" text-anchor="middle">−2</text>
  <text class="tick" x="590" y="352" text-anchor="middle">2</text>
  <text class="note" x="410" y="188">positive inputs pass through</text>
  <text class="note" x="135" y="308">negative inputs become 0</text>
</svg>
