<svg xmlns="http://www.w3.org/2000/svg" width="980" height="350" viewBox="0 0 980 350" role="img" aria-labelledby="title desc">
  <title id="title">CNN ending with an MLP classifier</title>
  <desc id="desc">Convolution and pooling layers extract spatial features; flattening converts them to a vector; linear layers produce class scores.</desc>
  <rect width="100%" height="100%" fill="#fff"/>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #111827; }
    .box { fill: #f9fafb; stroke: #9ca3af; stroke-width: 1.8; }
    .conv { fill: #dbeafe; stroke: #60a5fa; stroke-width: 1.8; }
    .pool { fill: #fef3c7; stroke: #f59e0b; stroke-width: 1.8; }
    .mlp { fill: #d1fae5; stroke: #34d399; stroke-width: 1.8; }
    .label { font-size: 18px; font-weight: 600; }
    .small { font-size: 14px; fill: #374151; }
    .note { font-size: 15px; fill: #4b5563; font-style: italic; }
    .arrow { stroke: #374151; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
    .card { filter: drop-shadow(0 2px 3px rgba(15, 23, 42, 0.14)); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#374151"/>
    </marker>
  </defs>

  <g class="card">
    <rect class="box" x="35" y="120" width="105" height="70" rx="10"/>
  </g>
  <text class="label" x="87.5" y="148" text-anchor="middle">image</text>
  <text class="small" x="87.5" y="172" text-anchor="middle">1 × 28 × 28</text>

  <g class="card">
    <rect class="conv" x="190" y="100" width="130" height="110" rx="10"/>
  </g>
  <text class="label" x="255" y="140" text-anchor="middle">Conv2d</text>
  <text class="small" x="255" y="165" text-anchor="middle">local filters</text>
  <text class="small" x="255" y="188" text-anchor="middle">8 channels</text>

  <g class="card">
    <rect class="pool" x="370" y="115" width="115" height="80" rx="10"/>
  </g>
  <text class="label" x="427.5" y="150" text-anchor="middle">MaxPool</text>
  <text class="small" x="427.5" y="174" text-anchor="middle">shrinks H, W</text>

  <g class="card">
    <rect class="conv" x="535" y="100" width="130" height="110" rx="10"/>
  </g>
  <text class="label" x="600" y="140" text-anchor="middle">Conv2d</text>
  <text class="small" x="600" y="165" text-anchor="middle">more features</text>
  <text class="small" x="600" y="188" text-anchor="middle">16 channels</text>

  <g class="card">
    <rect class="box" x="710" y="115" width="100" height="80" rx="10"/>
  </g>
  <text class="label" x="760" y="150" text-anchor="middle">Flatten</text>
  <text class="small" x="760" y="174" text-anchor="middle">vector</text>

  <g class="card">
    <rect class="mlp" x="855" y="105" width="100" height="100" rx="10"/>
  </g>
  <text class="label" x="905" y="145" text-anchor="middle">MLP</text>
  <text class="small" x="905" y="170" text-anchor="middle">10 class</text>
  <text class="small" x="905" y="191" text-anchor="middle">scores</text>

  <line class="arrow" x1="140" y1="155" x2="190" y2="155"/>
  <line class="arrow" x1="320" y1="155" x2="370" y2="155"/>
  <line class="arrow" x1="485" y1="155" x2="535" y2="155"/>
  <line class="arrow" x1="665" y1="155" x2="710" y2="155"/>
  <line class="arrow" x1="810" y1="155" x2="855" y2="155"/>
  <text class="note" x="490" y="285" text-anchor="middle">CNNs typically extract spatial features first, then finish with linear classifier layers.</text>
</svg>
