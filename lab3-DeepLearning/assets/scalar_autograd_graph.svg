<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="520" viewBox="0 0 1040 520" role="img" aria-labelledby="title desc">
  <title id="title">Forward and backward computation graph for squared error</title>
  <desc id="desc">For x equals 2, w equals 3, and y equals 5, the graph shows y_pred equals 6, error equals minus 1, loss equals 1, and gradients flowing backward through every step.</desc>
  <rect width="100%" height="100%" fill="#fff"/>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #111827; }
    .node { fill: #f9fafb; stroke: #9ca3af; stroke-width: 1.8; }
    .input { fill: #dbeafe; stroke: #60a5fa; stroke-width: 1.8; }
    .target { fill: #fef3c7; stroke: #f59e0b; stroke-width: 1.8; }
    .loss { fill: #d1fae5; stroke: #34d399; stroke-width: 1.8; }
    .label { font-size: 20px; font-weight: 600; }
    .small { font-size: 16px; fill: #1f2937; }
    .tiny { font-size: 14px; }
    .red { fill: #b91c1c; }
    .legend { font-size: 16px; }
    .forward { stroke: #1f2937; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .backward { stroke: #b91c1c; stroke-width: 2; fill: none; marker-end: url(#red-arrow); }
    .card { filter: drop-shadow(0 2px 3px rgba(15, 23, 42, 0.12)); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#1f2937"/>
    </marker>
    <marker id="red-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <text class="legend" x="35" y="35">Forward values: x = 2, w = 3, y = 5</text>
  <text class="legend red" x="35" y="60">Backward values: gradients from loss.backward()</text>

  <g class="card">
    <rect class="input" x="55" y="105" width="105" height="88" rx="8"/>
  </g>
  <text class="label" x="107.5" y="133" text-anchor="middle">x</text>
  <text class="small" x="107.5" y="158" text-anchor="middle">2</text>
  <text class="tiny red" x="107.5" y="181" text-anchor="middle">grad = 6</text>

  <g class="card">
    <rect class="input" x="55" y="275" width="105" height="88" rx="8"/>
  </g>
  <text class="label" x="107.5" y="303" text-anchor="middle">w</text>
  <text class="small" x="107.5" y="328" text-anchor="middle">3</text>
  <text class="tiny red" x="107.5" y="351" text-anchor="middle">grad = 4</text>

  <g class="card">
    <rect class="node" x="245" y="190" width="115" height="88" rx="8"/>
  </g>
  <text class="label" x="302.5" y="218" text-anchor="middle">x * w</text>
  <text class="small" x="302.5" y="243" text-anchor="middle">2 * 3 = 6</text>
  <text class="tiny red" x="302.5" y="266" text-anchor="middle">grad = 2</text>

  <g class="card">
    <rect class="node" x="435" y="190" width="115" height="88" rx="8"/>
  </g>
  <text class="label" x="492.5" y="218" text-anchor="middle">y_pred</text>
  <text class="small" x="492.5" y="243" text-anchor="middle">6</text>
  <text class="tiny red" x="492.5" y="266" text-anchor="middle">grad = 2</text>

  <g class="card">
    <rect class="target" x="435" y="355" width="115" height="88" rx="8"/>
  </g>
  <text class="label" x="492.5" y="383" text-anchor="middle">y</text>
  <text class="small" x="492.5" y="408" text-anchor="middle">5</text>
  <text class="tiny red" x="492.5" y="431" text-anchor="middle">grad = −2</text>

  <g class="card">
    <rect class="node" x="635" y="265" width="145" height="88" rx="8"/>
  </g>
  <text class="label" x="707.5" y="293" text-anchor="middle">y − y_pred</text>
  <text class="small" x="707.5" y="318" text-anchor="middle">5 − 6 = −1</text>
  <text class="tiny red" x="707.5" y="341" text-anchor="middle">grad = −2</text>

  <g class="card">
    <rect class="node" x="855" y="265" width="95" height="88" rx="8"/>
  </g>
  <text class="label" x="902.5" y="293" text-anchor="middle">**2</text>
  <text class="small" x="902.5" y="318" text-anchor="middle">(−1)²</text>
  <text class="tiny red" x="902.5" y="341" text-anchor="middle">grad = 1</text>

  <g class="card">
    <rect class="loss" x="855" y="405" width="95" height="68" rx="8"/>
  </g>
  <text class="label" x="902.5" y="433" text-anchor="middle">loss</text>
  <text class="small" x="902.5" y="458" text-anchor="middle">1</text>

  <line class="forward" x1="160" y1="149" x2="245" y2="218"/>
  <line class="forward" x1="160" y1="319" x2="245" y2="250"/>
  <line class="forward" x1="360" y1="234" x2="435" y2="234"/>
  <line class="forward" x1="550" y1="234" x2="635" y2="292"/>
  <line class="forward" x1="550" y1="399" x2="635" y2="327"/>
  <line class="forward" x1="780" y1="309" x2="855" y2="309"/>
  <line class="forward" x1="902.5" y1="353" x2="902.5" y2="405"/>

  <line class="backward" x1="902.5" y1="405" x2="902.5" y2="353"/>
  <line class="backward" x1="855" y1="318" x2="780" y2="318"/>
  <line class="backward" x1="635" y1="300" x2="550" y2="242"/>
  <line class="backward" x1="635" y1="334" x2="550" y2="407"/>
  <line class="backward" x1="435" y1="244" x2="360" y2="244"/>
  <line class="backward" x1="245" y1="226" x2="160" y2="157"/>
  <line class="backward" x1="245" y1="258" x2="160" y2="327"/>
</svg>
