[project]
name = "lab3-cnns"
version = "0.1.0"
description = "Teaching notebook for building MLP forward passes from scratch."
requires-python = ">=3.11,<3.13"
dependencies = [
    "ipykernel>=6.29",
    "jupyterlab>=4.4",
    "matplotlib>=3.10",
    "notebook>=7.4",
    "torch>=2.7",
    "torchvision>=0.22",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "platform_system == 'Linux'" },
]
torchvision = [
    { index = "pytorch-cpu", marker = "platform_system == 'Linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
